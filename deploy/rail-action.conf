<VirtualHost *:80>
    ServerName rail.mikegtn.net
    Redirect permanent / https://rail.mikegtn.net/
</VirtualHost>

<VirtualHost *:443>
    ServerName rail.mikegtn.net

    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/mikegtn_net.cer
    SSLCertificateKeyFile /etc/apache2/ssl/_.mikegtn.net_private_key.key

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass / http://127.0.0.1:8765/ connectiontimeout=5 timeout=60
    ProxyPassReverse / http://127.0.0.1:8765/

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer"

    ErrorLog ${APACHE_LOG_DIR}/rail-action-error.log
    CustomLog ${APACHE_LOG_DIR}/rail-action-access.log combined
</VirtualHost>
